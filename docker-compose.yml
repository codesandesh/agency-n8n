version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_content_factory
    user: root
    restart: always

    ports:
      - "5678:5678"

    env_file:
      - .env

    environment:
      # =========================
      # CORE N8N SETTINGS
      # =========================
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL:-info}
      - N8N_LOG_OUTPUT=console

      # =========================
      # SECURITY
      # =========================
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_EXPRESSIONS=false
      - N8N_ALLOW_EXECUTE_COMMAND=true

      # =========================
      # EXECUTION MODE (QUEUE)
      # =========================
      - EXECUTIONS_MODE=queue
      - QUEUE_HEALTH_CHECK_ACTIVE=true
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336

      # =========================
      # 🔥 COLLISION PREVENTION (IMPORTANT FIX)
      # =========================
      - QUEUE_BULL_PREFIX=n8n_content_factory
      - QUEUE_BULL_REDIS_DB=0
      - "REDIS_QUEUE_KEY_PREFIX=n8n_content_factory:"
      - EXECUTIONS_QUEUE=content_factory_queue

      # =========================
      # DATABASE (POSTGRES)
      # =========================
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_content_factory
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=public

      # =========================
      # REDIS
      # =========================
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}

      # =========================
      # APIS / INTEGRATIONS
      # =========================
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # Airtable
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}
      - AT_VIRAL_CONTENT_TABLE=${AT_VIRAL_CONTENT_TABLE}
      - AT_TABLE_VIRAL_DB=${AT_TABLE_VIRAL_DB}
      - AT_SCRIPT_LIBRARY_TABLE=${AT_SCRIPT_LIBRARY_TABLE}
      - AT_TABLE_SCRIPT_LIB=${AT_TABLE_SCRIPT_LIB}

      # Facebook
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN}

      # LinkedIn
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./n8n:/home/node/.n8n
      - ./logs:/home/node/.n8n/logs

    networks:
      - n8n-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================
  # POSTGRES
  # =========================
  postgres:
    image: postgres:15-alpine
    container_name: n8n_postgres_content_factory
    restart: always

    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n_content_factory
      - PGDATA=/var/lib/postgresql/data/pgdata

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data

    networks:
      - n8n-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n_content_factory"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =========================
  # REDIS
  # =========================
  redis:
    image: redis:7-alpine
    container_name: n8n_redis_content_factory
    restart: always

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --databases 16

    volumes:
      - ./redis-data:/data

    networks:
      - n8n-network

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =========================
# NETWORK
# =========================
networks:
  n8n-network:
    driver: bridge